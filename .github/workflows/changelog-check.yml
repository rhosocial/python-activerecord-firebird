name: Changelog Check

on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled]

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Check for changelog entry
      run: |
        if [ -z "$(ls -A changelog.d/ 2>/dev/null | grep -v '\.gitkeep\|README\.md\|template\.md')" ]; then
          # Check if 'skip-changelog' label is applied
          if [ "${{ github.event.label.name }}" == "skip-changelog" ]; then
            echo "Skipping changelog check - 'skip-changelog' label applied"
            exit 0
          fi
          echo "No changelog entry found in changelog.d/"
          echo "If this PR doesn't need a changelog entry, add the 'skip-changelog' label"
          exit 1
        fi