# .github/workflows/test.yml
name: Python Test and Coverage with Firebird

on:
  push:
    branches:
      - main
      - 'release/v**'
      - 'maint/**'
  pull_request:
    branches:
      - main
      - 'release/v**'
      - 'maint/**'

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / Firebird ${{ matrix.firebird-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python-version: '3.11', firebird-version: '5', port: 3050 }
          - { python-version: '3.12', firebird-version: '6-snapshot', port: 3051 }
          - { python-version: '3.13', firebird-version: '5', port: 3052 }
          - { python-version: '3.14', firebird-version: '6-snapshot', port: 3053 }

    services:
      firebird:
        image: firebirdsql/firebird:${{ matrix.firebird-version }}
        env:
          FIREBIRD_ROOT_PASSWORD: password
          FIREBIRD_USE_LEGACY_AUTH: "true"
          FIREBIRD_DATABASE: /var/lib/firebird/data/test_db
          TZ: UTC
        options: >-
          --health-cmd "bash -c 'fbsvcmgr localhost:service_mgr user SYSDBA password password info_server_version 2>/dev/null | head -1' || bash -c 'echo \"select 1 from rdb\$database\" | isql -u SYSDBA -p password localhost:service_mgr 2>/dev/null | head -1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - ${{ matrix.port }}:3050

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install firebird client library
        run: |
          sudo apt-get update
          sudo apt-get install -y libfbclient2

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install activerecord and testsuite
        run: |
          pip install git+https://github.com/rhosocial/python-activerecord.git@release/v1.0.0.dev29#egg=rhosocial-activerecord
          pip install git+https://github.com/rhosocial/python-activerecord-testsuite.git@release/v1.0.0.dev16#egg=rhosocial-activerecord-testsuite

      - name: Verify Firebird connection and create test user
        run: |
          python << 'PYEOF'
          import firebird.driver as fdb
          dsn = '127.0.0.1/${{ matrix.port }}:/var/lib/firebird/data/test_db'
          conn = fdb.connect(database=dsn, user='SYSDBA', password='password', charset='UTF8')
          cur = conn.cursor()
          cur.execute("SELECT rdb$get_context('SYSTEM', 'ENGINE_VERSION') FROM rdb$database")
          ver = cur.fetchone()[0]
          cur.execute("SELECT 1 FROM rdb$database")
          cur.fetchone()
          print(f'Firebird {ver} connectivity test passed')
          cur.execute("SELECT current_user, current_role FROM rdb$database")
          u, r = cur.fetchone()
          print(f'Connected as {u}, role: {r}')
          cur.execute("CREATE OR ALTER USER root PASSWORD 'password' GRANT ADMIN ROLE")
          conn.commit()
          print('Test user "root" created/verified')
          cur.close()
          conn.close()
          PYEOF

      - name: Verify root user login
        run: |
          python << 'PYEOF'
          import firebird.driver as fdb
          dsn = '127.0.0.1/${{ matrix.port }}:/var/lib/firebird/data/test_db'
          conn = fdb.connect(database=dsn, user='root', password='password', charset='UTF8')
          cur = conn.cursor()
          cur.execute("SELECT current_user FROM rdb$database")
          print(f'Root login verified: {cur.fetchone()[0]}')
          cur.close()
          conn.close()
          PYEOF

      - name: Create Firebird scenario config
        run: |
          cat > firebird_scenarios.yaml << EOF
          scenarios:
            firebird_default:
              host: 127.0.0.1
              port: ${{ matrix.port }}
              database: /var/lib/firebird/data/test_db
              username: SYSDBA
              password: password
              charset: UTF8
              autocommit: false
              timezone: UTC
          EOF
          echo "FIREBIRD_SCENARIOS_CONFIG_PATH=$(pwd)/firebird_scenarios.yaml" >> $GITHUB_ENV
          echo "FIREBIRD_HOST=127.0.0.1" >> $GITHUB_ENV
          echo "FIREBIRD_PORT=${{ matrix.port }}" >> $GITHUB_ENV
          echo "FIREBIRD_DATABASE=/var/lib/firebird/data/test_db" >> $GITHUB_ENV
          echo "FIREBIRD_USERNAME=SYSDBA" >> $GITHUB_ENV
          echo "FIREBIRD_PASSWORD=password" >> $GITHUB_ENV
          echo "FIREBIRD_CHARSET=UTF8" >> $GITHUB_ENV

      - name: Run tests
        run: |
          export PYTHONPATH=src:tests
          python -m pytest tests/ --tb=short

      - name: Run tests with coverage (3.14 + 6-snapshot only)
        if: matrix.python-version == '3.14' && matrix.firebird-version == '6-snapshot'
        run: |
          export PYTHONPATH=src:tests
          pip install codecov
          coverage run --source=src -m pytest tests/ --tb=short
          coverage xml
          coverage report

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.14' && matrix.firebird-version == '6-snapshot'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests,python-${{ matrix.python-version }},firebird-${{ matrix.firebird-version }}
          name: codecov-firebird-${{ matrix.python-version }}-${{ matrix.firebird-version }}
          fail_ci_if_error: false